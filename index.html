<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fff4de">
<meta property="og:type" content="website">
<meta property="og:title" content="인정욕구 채우기">
<meta property="og:image" content="https://aaffffffffff123-lang.github.io/egotrip/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<title>인정욕구 채우기</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎺</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#221a2b; --cream:#fff4de; --paper:#fffaf0; --cobalt:#2f5bd8; --vermilion:#ee4a2c; --mustard:#ffbf2e; --teal:#13a08a; --plum:#7b3fb0;
  --fd:"Hahmlet","Noto Serif KR",serif; --ft:"IBM Plex Sans KR","Noto Sans KR",sans-serif;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px); --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e2c0;color:var(--ink);font-family:var(--ft);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none}
#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font-family:inherit;color:inherit}

/* ---------- 오타마톤 줄기 ---------- */
#controls{position:fixed;inset:0;pointer-events:none;z-index:5}
#controls.off{display:none}
#stem{position:absolute;right:calc(10px + var(--sar));top:calc(15% + var(--sat));bottom:calc(64px + var(--sab));width:min(22vw,86px);pointer-events:auto;touch-action:none}
#stemBody{position:absolute;left:50%;top:0;bottom:0;width:58%;margin-left:-29%;border-radius:999px;
  background:linear-gradient(90deg,#1b1828 0%,#3a3550 38%,#26223a 62%,#141220 100%);
  box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(34,26,43,.35)}
#ribbon{position:absolute;left:50%;top:12px;bottom:12px;width:30%;margin-left:-15%;border-radius:999px;
  background:linear-gradient(90deg,#ece2cf,#fffaf0 50%,#e7dcc6);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
#ribbon .hi{position:absolute;left:0;right:0;top:0;height:16%;border-radius:999px 999px 6px 6px;background:linear-gradient(180deg,#ffd76a,#ffe9a8 70%,rgba(255,233,168,0))}
#marks{position:absolute;inset:0}
#marks i{position:absolute;left:50%;border-radius:50%;transform:translate(-50%,-50%);transition:opacity .18s}
#marks i.ct{width:15px;height:15px;background:var(--vermilion);box-shadow:0 0 0 2px var(--ink)}
#marks i.st{width:7px;height:7px;background:#5d5670}
#marks i.tk{width:12px;height:2px;border-radius:1px;background:#8f879f}
#marks i.tk.c{width:20px;height:3px;background:#5d5670}
#headKnob{position:absolute;left:50%;bottom:-52px;width:72px;height:56px;margin-left:-36px;pointer-events:none;
  border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a4462,#1b1828 70%);box-shadow:0 0 0 3px var(--ink),0 5px 0 3px rgba(34,26,43,.3);transform:rotate(-14deg)}
#finger{position:absolute;left:50%;top:0;will-change:transform;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;display:none;pointer-events:none;
  background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(255,215,106,.75) 32%,rgba(255,215,106,0) 70%)}
#finger.on{display:block}
/* 처음 한 번 누르기 전까지 줄기가 노랗게 숨 쉼 (글 설명 대신) */
#stem.hint #ribbon::before{content:'';position:absolute;inset:0;border-radius:999px;background:#ffc93d;animation:ribbonHint 1.2s ease-in-out infinite}
#stem.hint #stemBody{animation:stemHalo 1.2s ease-in-out infinite}
@keyframes ribbonHint{0%,100%{opacity:0}50%{opacity:.7}}
@keyframes stemHalo{0%,100%{box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(34,26,43,.35),0 0 0 0 rgba(255,191,46,0)}50%{box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(34,26,43,.35),0 0 22px 8px rgba(255,191,46,.85)}}

/* ---------- 위쪽 버튼 ---------- */
#pause{position:fixed;left:calc(10px + var(--sal));top:calc(10px + var(--sat));z-index:6;width:46px;height:46px;border-radius:50%;border:none;
  background:var(--paper);box-shadow:0 0 0 3px var(--ink),0 4px 0 3px rgba(34,26,43,.3);display:none;align-items:center;justify-content:center;gap:5px;cursor:pointer}
#nextSong{position:fixed;left:calc(70px + var(--sal));top:calc(10px + var(--sat));z-index:6;height:46px;padding:0 13px;border:0;border-radius:999px;
  background:var(--paper);box-shadow:0 0 0 3px var(--ink),0 4px 0 3px rgba(34,26,43,.3);display:none;align-items:center;gap:7px;font:700 14px var(--ft);cursor:pointer}
#nextSong svg{width:14px;height:14px;fill:currentColor}
#nextSong:active{transform:translateY(2px)}
#nextSong:disabled{opacity:.55;cursor:default}
#pause i{display:block;width:5px;height:16px;border-radius:2px;background:var(--ink)}
.mode{display:inline-flex;border-radius:999px;background:var(--paper);box-shadow:0 0 0 3px var(--ink),0 4px 0 3px rgba(34,26,43,.3);padding:3px;gap:2px}
.mode button{border:none;border-radius:999px;background:transparent;font:700 14px var(--ft);padding:7px 13px;cursor:pointer;white-space:nowrap}
.mode button.on{background:var(--ink);color:var(--paper)}
#hudMode{position:fixed;right:calc(10px + var(--sar));top:calc(12px + var(--sat));z-index:6;display:none}
/* 공연 끝내기 · 끝난 뒤 버튼 */
.pill{height:46px;padding:0 14px;border:0;border-radius:999px;background:var(--paper);box-shadow:0 0 0 3px var(--ink),0 4px 0 3px rgba(34,26,43,.3);display:inline-flex;align-items:center;gap:7px;font:700 14px var(--ft);cursor:pointer;white-space:nowrap}
.pill:active{transform:translateY(2px)}
.pill.go{background:var(--vermilion);color:var(--paper)}
#endShow{position:fixed;left:calc(10px + var(--sal));top:calc(66px + var(--sat));z-index:6;display:none}
#endShow i{display:block;width:11px;height:11px;border-radius:2.5px;background:var(--vermilion)}
#finBar{position:fixed;left:calc(70px + var(--sal));top:calc(10px + var(--sat));z-index:6;display:none;gap:12px}

/* 혐규오락실: 위쪽 가운데의 얼굴 버튼. 첫 화면과 공연 중 모두 얼굴만 (그 줄의 다른 버튼과 겹치면 가장 가까운 빈자리 — 자리는 스크립트가 잡음) */
#arcade{position:fixed;left:50%;top:calc(9px + var(--sat));z-index:6;display:flex;align-items:center;gap:7px;height:48px;padding:2px 4px;transform:translateX(-50%);
  text-decoration:none;color:var(--ink);touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-drag:none}
#arcade svg{display:block;width:44px;height:44px;flex:none;overflow:visible;filter:drop-shadow(0 3.5px 0 rgba(34,26,43,.3))}
#arcade:active svg{transform:translateY(2px);filter:drop-shadow(0 1.5px 0 rgba(34,26,43,.3))}
#arcade.title{z-index:12}
#arcade.over{z-index:12}
#arcade.placed{transform:none;transition:left .2s ease,top .2s ease}
#arcade.off{display:none}
/* ---------- 덮개 화면 ---------- */
.screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:calc(14px + var(--sat)) 14px calc(14px + var(--sab));background:rgba(255,244,222,.28)}
.screen.hide{display:none}
.card{width:min(460px,100%);max-height:100%;overflow:auto;background:var(--paper);border-radius:24px;padding:20px 20px 16px;position:relative;
  box-shadow:0 0 0 3px var(--ink),0 10px 0 3px rgba(34,26,43,.32)}
.card .tape{position:absolute;left:24px;right:24px;top:-1px;height:10px;border-radius:0 0 8px 8px;
  background:repeating-linear-gradient(90deg,var(--cobalt) 0 22px,var(--mustard) 22px 44px,var(--vermilion) 44px 66px,var(--teal) 66px 88px)}
.kicker{margin-top:10px;font:700 13px var(--ft);color:var(--cobalt);letter-spacing:.14em}
/* ---------- 첫 화면: 제목과 시작 버튼 하나 (아무 데나 눌러도 시작) ---------- */
#title{flex-direction:column;justify-content:space-between;align-items:center;cursor:pointer;
  padding:calc(max(7vh,56px) + var(--sat)) 16px calc(8vh + var(--sab));
  background:linear-gradient(180deg,rgba(255,244,222,.86) 0%,rgba(255,244,222,.5) 26%,rgba(255,244,222,0) 48%,rgba(255,244,222,0) 62%,rgba(255,244,222,.55) 86%,rgba(255,244,222,.8) 100%)}
.logo{display:block;width:min(92vw,560px);height:auto;max-height:42vh;transform:rotate(-3.5deg);overflow:visible;
  filter:drop-shadow(0 7px 0 rgba(34,26,43,.22))}
.logo text{font-family:var(--fd);font-weight:900;font-size:150px;letter-spacing:-4px;fill:var(--ink);
  stroke:var(--paper);stroke-width:26px;stroke-linejoin:round;paint-order:stroke fill}
.logo text.em{fill:var(--vermilion)}
#start{position:relative;overflow:hidden;flex:none;width:min(330px,80vw);height:76px;border:0;border-radius:999px;cursor:pointer;
  background:var(--vermilion);color:var(--paper);font:900 32px var(--fd);letter-spacing:.06em;
  box-shadow:0 0 0 3.5px var(--ink),0 8px 0 3.5px rgba(34,26,43,.32)}
#start b{position:relative;font-weight:900}
#start .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:#ffd36b;transition:width .25s}
#start:not(:disabled) .fill{opacity:0}
#start:disabled{background:#f1e2c6;color:var(--ink);cursor:default}
#start:disabled b{font:700 19px var(--ft);letter-spacing:0}
#start:not(:disabled){animation:startPulse 1.5s ease-in-out infinite}
#start:not(:disabled):active{animation:none;transform:translateY(4px);box-shadow:0 0 0 3.5px var(--ink),0 4px 0 3.5px rgba(34,26,43,.32)}
@keyframes startPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (min-aspect-ratio:1/1){ #title{padding-top:calc(4vh + 32px + var(--sat));padding-bottom:calc(6vh + var(--sab))} .logo{max-height:47vh} }
.pickmode{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px}
.pickmode button{border:none;border-radius:16px;padding:12px 10px 11px;text-align:left;background:var(--cream);box-shadow:0 0 0 2.5px var(--ink),0 4px 0 2.5px rgba(34,26,43,.25);cursor:pointer}
.pickmode button b{display:block;font:900 19px var(--fd)}
.pickmode button span{display:block;margin-top:3px;font:400 12.5px/1.4 var(--ft);color:#5a5468}
.pickmode button.on{background:var(--mustard)}
.big{display:block;width:100%;border:none;border-radius:16px;padding:15px 0 16px;font:900 22px var(--fd);color:var(--paper);background:var(--vermilion);
  box-shadow:0 0 0 3px var(--ink),0 6px 0 3px rgba(34,26,43,.3);cursor:pointer}
.big:active{transform:translateY(3px);box-shadow:0 0 0 3px var(--ink),0 3px 0 3px rgba(34,26,43,.3)}
.big:disabled{background:#cdbda3}
.small{display:block;width:100%;margin-top:12px;border:none;border-radius:14px;padding:12px 0 13px;font:700 16px var(--ft);background:var(--cream);
  box-shadow:0 0 0 2.5px var(--ink),0 4px 0 2.5px rgba(34,26,43,.25);cursor:pointer}
.credit{margin:12px 0 0;font:400 11px/1.4 var(--ft);color:#8a8496}

/* ---------- 필살기: 트럼펫 두 대 ---------- */
#special{position:fixed;left:calc(12px + var(--sal));bottom:calc(16px + var(--sab));z-index:6;width:100px;height:100px;border:0;padding:0;border-radius:50%;display:none;cursor:pointer;touch-action:none;
  background:radial-gradient(circle at 50% 40%,#fffdf6 0%,#fff1d2 70%,#f6dcae 100%);box-shadow:0 0 0 3.5px var(--ink),0 7px 0 3.5px rgba(34,26,43,.32);--g:0%;-webkit-user-select:none;user-select:none}
#special .fill{position:absolute;inset:0;border-radius:50%;overflow:hidden;pointer-events:none}
#special .fill::before{content:'';position:absolute;left:0;right:0;bottom:0;height:var(--g);background:linear-gradient(180deg,#ff9a4a 0%,#ff6a3a 50%,#e8402c 100%);transition:height .15s linear}
#special .fill::after{content:'';position:absolute;left:0;right:0;bottom:var(--g);height:3px;margin-bottom:-1.5px;background:rgba(255,255,255,.85);opacity:.8}
#special svg{position:absolute;left:4px;top:4px;width:92px;height:92px;pointer-events:none;filter:saturate(.25) brightness(.95);transition:filter .25s, transform .2s}
#special.ready svg,#special.on svg{filter:none}
#special .spark{position:absolute;width:14px;height:14px;pointer-events:none;opacity:0;background:radial-gradient(circle,#fff 0 18%,rgba(255,236,150,.9) 30%,rgba(255,236,150,0) 70%);transform:scale(.4)}
#special .spark::before,#special .spark::after{content:'';position:absolute;left:50%;top:-3px;bottom:-3px;width:2px;margin-left:-1px;background:linear-gradient(#fff0,#fff,#fff0)}
#special .spark::after{transform:rotate(90deg)}
#special.ready .spark{animation:spSpark 1.4s ease-in-out infinite}
#special .spark.s1{left:-2px;top:8px}#special .spark.s2{right:-4px;top:30px;animation-delay:.45s!important}#special .spark.s3{left:40px;top:-8px;animation-delay:.9s!important}
@keyframes spSpark{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1.25) rotate(45deg)}}
#special.ready{animation:spReady 1.1s ease-in-out infinite}
@keyframes spReady{0%,100%{box-shadow:0 0 0 3.5px var(--ink),0 7px 0 3.5px rgba(34,26,43,.32),0 0 0 0 rgba(255,191,46,0)}50%{box-shadow:0 0 0 3.5px var(--ink),0 7px 0 3.5px rgba(34,26,43,.32),0 0 28px 12px rgba(255,191,46,.95)}}
#special.on{transform:translateY(4px) scale(.95);box-shadow:0 0 0 3.5px var(--ink),0 3px 0 3.5px rgba(34,26,43,.32),0 0 34px 14px rgba(255,120,40,.9)}
#special.on svg{transform:scale(1.08) rotate(-4deg)}
#special.nope{animation:spNope .38s}
@keyframes spNope{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px) rotate(-8deg)}60%{transform:translateX(6px) rotate(8deg)}}
@media (min-aspect-ratio:1/1){ #special{width:92px;height:92px;bottom:calc(12px + var(--sab))} #special svg{width:84px;height:84px} }
@media (min-aspect-ratio:1/1){
  #stem{top:calc(14px + var(--sat));bottom:calc(58px + var(--sab));width:84px}
  #hudMode{right:auto;left:calc(68px + var(--sal))}
  #nextSong{left:calc(208px + var(--sal))}
  #endShow{left:calc(314px + var(--sal));top:calc(10px + var(--sat))}
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="controls" class="off">
  <div id="stem"><div id="stemBody"></div><div id="ribbon"><div class="hi"></div><div id="marks"></div></div><div id="headKnob"></div><div id="finger"></div></div>
</div>
<button id="pause" aria-label="멈춤"><i></i><i></i></button>
<button id="nextSong" aria-label="다음 곡으로 넘기기">다음 곡<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 2v12l9-6zM12 2h2v12h-2z"/></svg></button>
<button id="endShow" class="pill" aria-label="공연 끝내기"><i></i>공연 끝내기</button>
<div id="finBar"><button id="encore" class="pill go">한 곡 더</button><button id="finHome" class="pill">처음으로</button></div>
<button id="special" aria-label="트럼펫 두 대"><span class="fill"></span><svg viewBox="9 9 102 102" aria-hidden="true">
  <defs>
    <linearGradient id="brA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4c0"/><stop offset=".35" stop-color="#ffd35c"/><stop offset=".72" stop-color="#e6a12a"/><stop offset="1" stop-color="#a8641a"/></linearGradient>
    <linearGradient id="brB" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe390"/><stop offset=".5" stop-color="#ffc947"/><stop offset="1" stop-color="#d48a22"/></linearGradient>
    <radialGradient id="bellIn" cx=".5" cy=".5" r=".55"><stop offset="0" stop-color="#7a3f10"/><stop offset=".55" stop-color="#c9801f"/><stop offset="1" stop-color="#ffd76a"/></radialGradient>
    <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#cfd4e2"/><stop offset="1" stop-color="#8d93a8"/></linearGradient>
    <g id="tpt" stroke="#221a2b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
      <path d="M30 27 L30 35 Q30 39 34 39 L64 39 Q68 39 68 35 L68 29" fill="none" stroke-width="7.4"/>
      <path d="M30 27 L30 35 Q30 39 34 39 L64 39 Q68 39 68 35 L68 29" fill="none" stroke="url(#brA)" stroke-width="3.6"/>
      <path d="M44 15 L44 9 M51 15 L51 9 M58 15 L58 9" stroke-width="2.4"/>
      <rect x="15" y="20.5" width="49" height="5.2" rx="2.4" fill="url(#brA)"/>
      <rect x="40.8" y="13" width="6.4" height="19" rx="2" fill="url(#brA)"/>
      <rect x="47.8" y="13" width="6.4" height="19" rx="2" fill="url(#brA)"/>
      <rect x="54.8" y="13" width="6.4" height="19" rx="2" fill="url(#brA)"/>
      <ellipse cx="44" cy="7.8" rx="3.6" ry="1.9" fill="#fff8ec"/><ellipse cx="51" cy="7.8" rx="3.6" ry="1.9" fill="#fff8ec"/><ellipse cx="58" cy="7.8" rx="3.6" ry="1.9" fill="#fff8ec"/>
      <rect x="62" y="20" width="26" height="6.4" rx="2.6" fill="url(#brA)"/>
      <path d="M86 20.2 C96 19 104 12 113 4 L113 43 C104 35 96 28.2 86 27 Z" fill="url(#brB)"/>
      <ellipse cx="113" cy="23.5" rx="3.6" ry="19.8" fill="#ffe08a"/>
      <ellipse cx="113.6" cy="23.5" rx="2" ry="16.5" fill="url(#bellIn)" stroke-width="1.2"/>
      <path d="M3 19.5 Q3 17 6 17.4 L15 21.2 L15 25 L6 28.8 Q3 29.2 3 26.7 Z" fill="url(#sil)"/>
      <path d="M18 22 L62 22 M64 21.6 L86 21.6 M89 18.8 C98 17 104 12 110 7" fill="none" stroke="#fffbe6" stroke-width="1.3" opacity=".85"/>
    </g>
  </defs>
  <g transform="translate(60 60) rotate(-38) translate(-58 -24)"><use href="#tpt"/></g>
  <g transform="translate(60 60) scale(-1 1) rotate(-38) translate(-58 -24)"><use href="#tpt"/></g>
</svg><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></button>
<div id="hudMode" class="mode"><button data-m="snap">보정</button><button data-m="free">자유</button></div>
<a id="arcade" class="title" href="https://aaffffffffff123-lang.github.io/arcade/" target="_top" aria-label="혐규오락실 — 다른 게임 하러 가기" title="혐규오락실"><svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24.00 2.84 C27.19 2.93 30.48 3.49 33.44 4.70 C36.39 5.91 39.79 7.65 41.72 10.08 C43.64 12.51 44.41 16.18 44.97 19.28 C45.53 22.39 45.73 25.72 45.08 28.74 C44.42 31.76 43.07 35.11 41.06 37.40 C39.05 39.69 35.87 41.15 33.03 42.47 C30.19 43.79 27.09 45.14 24.00 45.31 C20.91 45.47 17.40 44.72 14.49 43.46 C11.58 42.19 8.30 40.21 6.54 37.72 C4.78 35.22 4.45 31.57 3.93 28.51 C3.41 25.45 2.76 22.23 3.42 19.37 C4.08 16.52 6.10 13.90 7.91 11.36 C9.72 8.82 11.61 5.56 14.29 4.14 C16.97 2.72 20.81 2.75 24.00 2.84 Z" fill="#fffaf0" stroke="#221a2b" stroke-width="2.7" stroke-linejoin="round"/><g stroke="#221a2b" stroke-width="2.3" stroke-linecap="round" fill="none"><path d="M13.2 8.4V17.9"/><path d="M20.4 6.2V16.6"/><path d="M27.6 6.2V16.6"/><path d="M34.6 8.8V18.3"/></g><g fill="#221a2b"><ellipse cx="18.1" cy="25.2" rx="2" ry="2.3"/><ellipse cx="29.9" cy="25.2" rx="2" ry="2.3"/></g><path d="M19.9 32.3a4.6 4.6 0 0 0 8.2 0" fill="none" stroke="#221a2b" stroke-width="2.3" stroke-linecap="round"/></svg></a>

<div id="title" class="screen">
  <svg class="logo" viewBox="0 0 640 380" role="img" aria-label="인정욕구 채우기">

        if (i % 3 === 0) { g.beginPath(); g.arc(x0 + rnd.range(0, 256), rnd.range(0, H), r, 0, Math.PI * 2); g.fill(); }
        else if (i % 3 === 1) g.fillRect(x0 + rnd.range(-20, 220), rnd.range(-20, H - 40), rnd.range(40, 150), rnd.range(14, 60));
        else { g.beginPath(); g.moveTo(x0 + rnd.range(0, 256), rnd.range(0, H)); g.lineTo(x0 + rnd.range(0, 256), rnd.range(0, H)); g.lineTo(x0 + rnd.range(0, 256), rnd.range(0, H)); g.fill(); }
      }

      g.restore();
    }
  });
}
// 커튼(주름) 텍스처
function _curtainTex() {
  return canvasTex(256, 64, (g, w, h) => {
    for (let x = 0; x < w; x++) { const t = (Math.sin(x / w * Math.PI * 2 * 8) + 1) / 2; const c = new THREE.Color('#8e1a2a').lerp(new THREE.Color('#d8415a'), t * 0.9); g.fillStyle = '#' + c.getHexString(); g.fillRect(x, 0, 1, h); }
  }, [14, 1]);
}

// ---------- 작은 기하 도우미 (venue 전용) ----------
function _vm(parts) { return mergeVC(parts.map(p => vcol(p[0], p[1], p[2]))); }      // [[geo, color, matrix?], ...] → 꼭짓점색 병합
function _boxAt(w, h, d, x, y, z, r = 0.02) { return rbox(w, h, d, r, 2).translate(x, y, z); }
// 전구·점 조명용 Points (한 번의 드로우콜로 여러 개의 빛 번짐)
function _glowPoints(positions, color, size, opacity = 0.9) {
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  const m = new THREE.PointsMaterial({ map: glowTexture(), color: new THREE.Color(color), size, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
  return new THREE.Points(geo, m);
}
// 색이 다른 점들을 한 Points 로 (버킷용): items = [{pos:[x,y,z,...], color}]
function _glowPointsVC(items, size, opacity = 0.85) {
  const pos = [], col = [], c = new THREE.Color();
  for (const it of items) { c.set(it.color); for (let i = 0; i < it.pos.length; i += 3) { pos.push(it.pos[i], it.pos[i + 1], it.pos[i + 2]); col.push(c.r, c.g, c.b); } }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  const m = new THREE.PointsMaterial({ map: glowTexture(), vertexColors: true, size, transparent: true, opacity, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true });
  return new THREE.Points(geo, m);
}
// 소품 그룹(makeAmp 등)을 재질 종류별 버킷에 굽기 — 텍스처 메시는 map 별로 따로 모음
function _bakeInto(group, BK) {
  group.updateMatrixWorld(true);
  group.traverse(o => {
    if (!o.isMesh) return;
    const m = o.material, g = o.geometry.clone().applyMatrix4(o.matrixWorld);
    if (m.map) { const key = m.map.uuid; (BK.textured[key] = BK.textured[key] || { mat: m, geos: [] }).geos.push(g); return; }
    const col = m.color ? '#' + m.color.getHexString() : '#ffffff';
    if (m.isMeshBasicMaterial) BK.unlit.push([g, col]);
    else if (m.isMeshStandardMaterial && m.metalness >= 0.5) BK.metal.push([g, col]);
    else if (m.isMeshStandardMaterial) BK.dark.push([g, col]);
    else BK.toon.push([g, col]);
  });
}
// 아치 창 윤곽 (아래 y0, 직선 꼭대기 y1, 반원 위로)
function _archPath(cx, y0, y1, w, path) {
  const r = w / 2;
  path.moveTo(cx - r, y0); path.lineTo(cx + r, y0); path.lineTo(cx + r, y1); path.absarc(cx, y1, r, 0, Math.PI, false); path.lineTo(cx - r, y0);
  return path;
}

// =====================================================================
function buildVenue(scene) {
  const R = LAYOUT.room, ST = LAYOUT.stage, pal = STYLE.pal;
  const VENUE = { seats: [], standSpots: [], barSpots: [], bartender: null, sun: null, lights: {}, anim: {} };
  const root = new THREE.Group(); root.name = 'venue'; scene.add(root);
  const cx = (R.x0 + R.x1) / 2, cz = (R.zFront + R.zBack) / 2, W = R.x1 - R.x0, D = R.zBack - R.zFront, H = R.h;
  const add = (geo, mat, cast = false, recv = false, name) => { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; if (name) m.name = name; root.add(m); return m; };
  // 공용 재질
  const matWalnut = glossMat('#ffffff', 0.45, { vc: true, outline: 0.003, env: 0.35 });   // 징두리·들보·가구 (꼭짓점색)
  const matBrass = metalMat(pal.brass, 0.25, { outline: 0.003 });
  const matBrassVC = metalMat('#ffffff', 0.28, { vc: true, outline: 0.003, side: THREE.FrontSide });
  // 재질 종류별 병합 버킷 (드로우콜 절감): [geo, color, matrix?] → buildVenue 끝에서 종류마다 메시 1개
  const BK = VENUE._bk = { shell: [], wood: [], metal: [], dark: [], unlit: [], toon: [], lit: [], textured: {}, glowS: [], glowB: [] };

  // ---------- 바닥 ----------
  const floor = add(new THREE.PlaneGeometry(W, D).rotateX(-Math.PI / 2).translate(cx, 0, cz), toonMat('#ffffff', { map: _herringboneTex(), outline: 0, soft: true }), false, true, 'floor');

  // ---------- 벽 (코발트) : 양 옆벽은 창 구멍을 낸 Shape ----------
  const wallParts = [];
  // 뒷벽(관객 뒤, 바) / 무대 뒤 벽
  wallParts.push(new THREE.PlaneGeometry(W, H).translate(cx, H / 2, R.zFront + 0.001));
  wallParts.push(new THREE.PlaneGeometry(W, H).rotateY(Math.PI).translate(cx, H / 2, R.zBack - 0.001));
  // 옆벽: 창 위치 (z 중심, 폭, 창턱, 직선부 꼭대기 → 아치)
  const winL = [-5.6, -8.6, -11.6], winR = [-7.2, -10.6], winW = 1.5, sill = 1.15, top = 3.3;
  // 왼벽(x0): 법선 +x 가 되도록 u=-z 로 그려 rotateY(+π/2) ((u,v,0)→(0,v,-u)). 오른벽(x1): u=z, rotateY(-π/2) ((u,v,0)→(0,v,u)), 법선 -x
  const sideWall = (x, wins, left) => {
    const s = left ? -1 : 1, u0 = Math.min(s * R.zFront, s * R.zBack), u1 = Math.max(s * R.zFront, s * R.zBack);
    const sh = new THREE.Shape(); sh.moveTo(u0, 0); sh.lineTo(u1, 0); sh.lineTo(u1, H); sh.lineTo(u0, H); sh.closePath();
    for (const z of wins) { const p = new THREE.Path(); _archPath(s * z, sill, top, winW, p); sh.holes.push(p); }
    const geo = new THREE.ShapeGeometry(sh, 12);
    geo.rotateY(left ? Math.PI / 2 : -Math.PI / 2);
    geo.translate(x, 0, 0);
    return geo;
  };
  wallParts.push(sideWall(R.x0 + 0.001, winL, true), sideWall(R.x1 - 0.001, winR, false));
  for (const g of wallParts) BK.shell.push([g, pal.cobalt]);

  // ---------- 징두리(월넛 패널) + 체어레일(크림) + 상단 프리즈(크림) + 코니스 ----------
  const trim = [], cream = pal.cream, wal = pal.walnut, walD = pal.walnutDark;
  const wainH = 1.0, railY = 1.0, frieze0 = H - 0.42;
  const wallRun = (len, M, hasWins, wins) => {                  // 벽 한 면의 가로 장식을 로컬(x 방향 길이) 로 만들어 M 로 배치
    trim.push([rbox(len, wainH, 0.06, 0.012, 2).translate(0, wainH / 2, 0.03), wal, M]);
    trim.push([rbox(len, 0.07, 0.1, 0.012, 2).translate(0, railY + 0.035, 0.05), cream, M]);
    trim.push([rbox(len, 0.42, 0.05, 0.012, 2).translate(0, frieze0 + 0.21, 0.025), cream, M]);
    trim.push([rbox(len, 0.06, 0.1, 0.012, 2).translate(0, frieze0 - 0.03, 0.05), cream, M]);
    trim.push([rbox(len, 0.08, 0.04, 0.01, 1).translate(0, 0.04, 0.05), walD, M]);            // 걸레받이
    // 징두리 패널 몰딩 (사각 테두리) 0.9 m 간격
    for (let u = -len / 2 + 0.55; u < len / 2 - 0.4; u += 0.9) {
      trim.push([rbox(0.62, 0.03, 0.03, 0.008, 1).translate(u, 0.78, 0.075), walD, M]); trim.push([rbox(0.62, 0.03, 0.03, 0.008, 1).translate(u, 0.22, 0.075), walD, M]);
      trim.push([rbox(0.03, 0.59, 0.03, 0.008, 1).translate(u - 0.295, 0.5, 0.075), walD, M]); trim.push([rbox(0.03, 0.59, 0.03, 0.008, 1).translate(u + 0.295, 0.5, 0.075), walD, M]);
    }
  };
  wallRun(W, M4([cx, 0, R.zFront], [0, 0, 0]));                 // 뒷벽: 안쪽(+z)을 봄
  wallRun(W, M4([cx, 0, R.zBack], [0, Math.PI, 0]));            // 무대 뒤 벽
  wallRun(D, M4([R.x0, 0, cz], [0, Math.PI / 2, 0]));           // 왼벽: 로컬 +z → 월드 +x
  wallRun(D, M4([R.x1, 0, cz], [0, -Math.PI / 2, 0]));          // 오른벽
  // 창틀 (크림, 아치) + 창살 + 창턱 + 안쪽 벽두께(리빌)
  const frames = [], glassParts = [];
  const winFrame = (x, z, dirIn) => {                            // dirIn: 방 안쪽 방향 (+1 왼벽, -1 오른벽)
    const M = M4([x, 0, z], [0, dirIn > 0 ? Math.PI / 2 : -Math.PI / 2, 0]);   // 로컬 x → 월드 z, 로컬 +z → 방 안쪽
    const r = winW / 2, arcY = top;
    // 틀: 두 기둥 + 아치(토러스 반) + 창턱
    frames.push([rbox(0.09, top - sill, 0.14, 0.015, 2).translate(-r - 0.03, (top + sill) / 2, 0.05), cream, M]);
    frames.push([rbox(0.09, top - sill, 0.14, 0.015, 2).translate(r + 0.03, (top + sill) / 2, 0.05), cream, M]);
    frames.push([new THREE.TorusGeometry(r + 0.03, 0.05, 8, 24, Math.PI).translate(0, arcY, 0.05), cream, M]);
    frames.push([rbox(winW + 0.5, 0.08, 0.3, 0.015, 2).translate(0, sill - 0.04, 0.12), cream, M]);          // 창턱
    frames.push([rbox(winW + 0.3, 0.06, 0.08, 0.01, 1).translate(0, sill - 0.11, 0.04), walD, M]);           // 창턱 밑 몰딩
    // 창살: 세로 1 + 가로 2
    frames.push([rbox(0.035, top - sill, 0.035, 0.008, 1).translate(0, (top + sill) / 2, -0.1), cream, M]);
    frames.push([rbox(winW, 0.035, 0.035, 0.008, 1).translate(0, sill + (top - sill) * 0.42, -0.1), cream, M]);
    frames.push([rbox(winW, 0.035, 0.035, 0.008, 1).translate(0, sill + (top - sill) * 0.78, -0.1), cream, M]);
    frames.push([rbox(0.035, r, 0.035, 0.008, 1).translate(0, arcY + r / 2, -0.1), cream, M]);
    // 리빌(벽 두께 안쪽 면, 크림): 좌우·아래
    frames.push([rbox(0.04, top - sill, 0.3, 0.005, 1).translate(-r - 0.02, (top + sill) / 2, -0.15), cream, M]);
    frames.push([rbox(0.04, top - sill, 0.3, 0.005, 1).translate(r + 0.02, (top + sill) / 2, -0.15), cream, M]);
    // 유리(하늘): 창 모양 Shape, 벽 뒤 0.28 — 기본 재질, 텍스처
    const sh = new THREE.Shape(); _archPath(0, sill, top, winW + 0.02, sh);
    const gg = new THREE.ShapeGeometry(sh, 16);
    // uv: shape 좌표 → 0..1
    const uv = gg.attributes.uv; for (let i = 0; i < uv.count; i++) uv.setXY(i, (uv.getX(i) + r) / winW, (uv.getY(i) - sill) / (top - sill + r));
    gg.translate(0, 0, -0.28); gg.applyMatrix4(M); glassParts.push(gg);
  };
  for (const z of winL) winFrame(R.x0, z, +1);
  for (const z of winR) winFrame(R.x1, z, -1);
  BK.wood.push(...trim, ...frames);
  const skyMat = basicMat('#ffffff', { map: _skyTex(), side: THREE.DoubleSide, fog: false });
  add(mergeGeometries(glassParts.map(q => { const g = q.index ? q.toNonIndexed() : q; for (const k of Object.keys(g.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') g.deleteAttribute(k); return g; }), false), skyMat, false, false, 'sky');
  // 햇살 기둥: 왼쪽 창에서 햇빛 방향(sunDir)으로 바닥까지, 가산 혼합 반투명
  const sunDir = V3(0.95, -0.9, -0.55).normalize();           // 빛이 나아가는 방향 (왼쪽 위 뒤 → 오른쪽 아래 앞)
  VENUE.sunDir = sunDir;
  const shaftGeos = [];
  for (const z of winL) {
    const r = winW / 2, pts = [];
    const corners = [[R.x0, sill, z + r], [R.x0, top + r * 0.6, z + r], [R.x0, top + r * 0.6, z - r], [R.x0, sill, z - r]];
    for (const c of corners) { const t = (c[1] - 0.0) / -sunDir.y; pts.push(c, [c[0] + sunDir.x * t, 0.005, c[2] + sunDir.z * t]); }   // 창 모서리와 바닥 도달점
    const pos = [];
    const quad = (a, b, c2, d) => pos.push(...pts[a], ...pts[b], ...pts[c2], ...pts[a], ...pts[c2], ...pts[d]);
    quad(0, 1, 3, 2); quad(2, 3, 5, 4); quad(4, 5, 7, 6); quad(6, 7, 1, 0);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.computeVertexNormals(); shaftGeos.push(g);
  }
  const shaftParts = shaftGeos.map(g => [g, '#fff0c0']);
  // 바닥에 떨어지는 햇빛 자국 (밝은 가산 사각형)
  const patchGeos = [];
  for (const z of winL) { const t = (sill + 1.0) / -sunDir.y; const px = R.x0 + sunDir.x * t, pz = z + sunDir.z * t; patchGeos.push(new THREE.PlaneGeometry(winW * 1.6, 2.6).rotateX(-Math.PI / 2).rotateY(0.5).translate(px + 0.6, 0.012, pz)); }
  for (const g of patchGeos) { shaftParts.push([g, '#ffe6a8']); shaftParts.push([g.clone().translate(0, 0.004, 0), '#ffe6a8']); }   // 바닥 자국은 두 겹(더 밝게)
  add(_vm(shaftParts), basicMat('#ffffff', { vc: true, transparent: true, opacity: 0.17, additive: true, depthWrite: false, side: THREE.DoubleSide }), false, false, 'sunlight').renderOrder = 6;

  // ---------- 천장 + 들보(격자) ----------
  BK.shell.push([new THREE.PlaneGeometry(W, D).rotateX(Math.PI / 2).translate(cx, H, cz), '#fff6e4']);
  const beams = [];
  for (let z = R.zBack - 1.3; z > R.zFront; z -= 2.6) beams.push([rbox(W, 0.3, 0.22, 0.03, 2).translate(cx, H - 0.15, z), wal]);
  for (const x of [-5.7, -1.9, 1.9, 5.7]) beams.push([rbox(0.16, 0.2, D, 0.03, 2).translate(x, H - 0.4, cz), wal]);
  beams.push([rbox(W, 0.12, 0.12, 0.02, 1).translate(cx, H - 0.06, R.zFront + 0.06), cream], [rbox(W, 0.12, 0.12, 0.02, 1).translate(cx, H - 0.06, R.zBack - 0.06), cream]);
  beams.push([rbox(0.12, 0.12, D, 0.02, 1).translate(R.x0 + 0.06, H - 0.06, cz), cream], [rbox(0.12, 0.12, D, 0.02, 1).translate(R.x1 - 0.06, H - 0.06, cz), cream]);
  BK.wood.push(...beams);

  VENUE.root = root; VENUE._mats = { matWalnut, matBrass, matBrassVC, cream, wal, walD };
  _buildStage(VENUE, root, add);
  _buildAudience(VENUE, root, add);
  _buildBarAndDecor(VENUE, root, add);
  _buildLights(VENUE, scene, root);
  _finishBuckets(VENUE, root, add);
  return VENUE;
}
// 버킷 → 메시 (종류당 1 드로우콜)
function _finishBuckets(VENUE, root, add) {
  const BK = VENUE._bk, M = VENUE._mats;
  if (BK.shell.length) add(_vm(BK.shell), toonVC({ outline: 0, soft: true }), false, true, 'shell');
  if (BK.wood.length) add(_vm(BK.wood), M.matWalnut, true, true, 'wood');
  if (BK.metal.length) add(_vm(BK.metal), M.matBrassVC, false, false, 'metal');
  if (BK.dark.length) add(_vm(BK.dark), glossMat('#ffffff', 0.5, { vc: true, outline: 0.003 }), true, false, 'dark');
  if (BK.toon.length) add(_vm(BK.toon), toonVC({ outline: 0.0045 }), true, true, 'toon');
  if (BK.lit.length) add(_vm(BK.lit), toonVC({ outline: 0.004, emissive: '#fff0c8', emissiveIntensity: 0.8, soft: true }), false, false, 'lit');
  if (BK.unlit.length) add(_vm(BK.unlit), basicMat('#ffffff', { vc: true }), false, false, 'unlit');
  for (const key of Object.keys(BK.textured)) { const t = BK.textured[key]; add(_mergeUV(t.geos), t.mat, false, false, 'textured'); }
  if (BK.glowS.length) { const p = _glowPointsVC(BK.glowS, 0.5, 0.82); p.name = 'glowSmall'; root.add(p); VENUE.anim.glowSmall = p; }
  if (BK.glowB.length) { const p = _glowPointsVC(BK.glowB, 0.95, 0.72); p.name = 'glowBig'; root.add(p); VENUE.anim.glowBig = p; }
  delete VENUE._bk;
}

// ---------- 무대: 단·연주자 단·깔개·뒤 커튼·소품·조명 트러스 ----------
function _buildStage(VENUE, root, add) {
  const ST = LAYOUT.stage, RS = LAYOUT.riser, sy = LAYOUT.stageY, pal = STYLE.pal, M = VENUE._mats;
  const sx = (ST.x0 + ST.x1) / 2, sz = (ST.zFront + ST.zBack) / 2, sw = ST.x1 - ST.x0, sd = ST.zBack - ST.zFront;
  // 단 + 연주자 단 (판자 텍스처, uv 유지해 병합)
  const plank = toonMat('#ffffff', { map: _plankTex('#6b3a1c'), outline: 0, soft: true });
  const deck = new THREE.BoxGeometry(sw, sy, sd).translate(sx, sy / 2, sz);
  const riser = new THREE.BoxGeometry(RS.w, RS.h, RS.d).translate(RS.x, sy + RS.h / 2, RS.z);
  add(_mergeUV([deck, riser]), plank, true, true, 'stage');
  // 무대 앞면(관객 쪽) 짙은 패널 + 놋쇠 테두리 (앞 모서리·옆 모서리·단 앞)
  const face = [[rbox(sw, sy - 0.04, 0.06, 0.01, 1).translate(sx, sy / 2 - 0.02, ST.zFront - 0.02), pal.walnutDark]];
  for (let x = ST.x0 + 0.6; x < ST.x1; x += 1.2) face.push([rbox(0.9, sy - 0.16, 0.025, 0.008, 1).translate(x, sy / 2 - 0.02, ST.zFront - 0.055), pal.walnut]);
  VENUE._bk.wood.push(...face);
  const brassParts = [
    new THREE.CylinderGeometry(0.028, 0.028, sw, 12).rotateZ(Math.PI / 2).translate(sx, sy, ST.zFront),
    new THREE.CylinderGeometry(0.02, 0.02, sd, 10).rotateX(Math.PI / 2).translate(ST.x0, sy, sz),
    new THREE.CylinderGeometry(0.02, 0.02, sd, 10).rotateX(Math.PI / 2).translate(ST.x1, sy, sz),
    new THREE.CylinderGeometry(0.022, 0.022, RS.w, 10).rotateZ(Math.PI / 2).translate(RS.x, sy + RS.h, RS.z - RS.d / 2),
    new THREE.CylinderGeometry(0.018, 0.018, RS.d, 10).rotateX(Math.PI / 2).translate(RS.x - RS.w / 2, sy + RS.h, RS.z),
    new THREE.CylinderGeometry(0.018, 0.018, RS.d, 10).rotateX(Math.PI / 2).translate(RS.x + RS.w / 2, sy + RS.h, RS.z),
  ];
  for (const g of brassParts) VENUE._bk.metal.push([g, pal.brass]);

function _buildLights(VENUE, scene, root) {
  const L = VENUE.lights;

  // 해: 왼쪽 창 쪽에서 (sunDir 방향으로 진행)
  const sun = new THREE.DirectionalLight('#ffe0b0', 3.1);
  const tgt = V3(-0.5, 1.0, -4.5), d = VENUE.sunDir;
  sun.position.copy(tgt).addScaledVector(d, -18); sun.target.position.copy(tgt);
  sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
  Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 8, bottom: -8, near: 2, far: 42 });
  sun.shadow.bias = -0.0005; sun.shadow.normalBias = 0.03; sun.shadow.radius = 2;
  scene.add(sun); scene.add(sun.target); VENUE.sun = sun; L.sun = sun;
  const spot = (name, color, I, pos, aim, angle, pen = 0.6) => {
    const s = new THREE.SpotLight(color, I, 16, angle, pen, 2.0); s.position.set(...pos); s.target.position.set(...aim); scene.add(s); scene.add(s.target); L[name] = s; s.userData.base = I; s.userData.aim = V3(...aim); return s;
  };
  spot('key', '#ffd9a8', 48, [0.2, 3.75, -1.2], [0.0, 1.2, -2.8], 0.62, 0.6);
  spot('pink', '#ff6fb0', 34, [-1.7, 4.2, -4.3], [-1.7, 1.0, -1.9], 0.42, 0.7);
  spot('blue', '#6fa8ff', 34, [1.8, 4.2, -4.3], [1.9, 1.0, -1.4], 0.42, 0.7);
  const bar = new THREE.PointLight('#ffb470', 26, 7, 2); bar.position.set(3.3, 2.4, LAYOUT.crowd.barZ - 0.6); scene.add(bar); L.bar = bar;
  // 분위기: 관객 열기(0..1)에 따라 무대 조명 세기·흔들림
  VENUE.setMood = (heat01, t = 0) => {
    const h = clamp(heat01, 0, 1);
    L.key.intensity = (48 + 34 * h) * (VENUE.keyK == null ? 1 : VENUE.keyK);
    L.pink.intensity = 34 + 50 * h; L.blue.intensity = 34 + 50 * h;
    L.pink.target.position.set(L.pink.userData.aim.x + Math.sin(t * 1.7) * 0.7 * h, L.pink.userData.aim.y, L.pink.userData.aim.z + Math.cos(t * 1.3) * 0.5 * h);
    L.blue.target.position.set(L.blue.userData.aim.x + Math.sin(t * 1.4 + 1) * 0.7 * h, L.blue.userData.aim.y, L.blue.userData.aim.z + Math.cos(t * 1.9) * 0.5 * h);
    if (VENUE.anim.lensGlow) { VENUE.anim.lensGlow.material.size = 0.9 + 0.7 * h; VENUE.anim.lensGlow.material.opacity = 0.75 + 0.25 * h; }
  };
  const A = VENUE.anim, rnd = seeded(9); let flick = 0, flickT = 0;
  VENUE.rumble = k => { A.rumble = Math.min(1.4, (A.rumble || 0) + k); };
  VENUE.update = (dt, t, beat) => {
    if (A.fan) A.fan.rotation.y += dt * 3.2;
    if (A.rumble > 0.005) {
      A.rumble = Math.max(0, A.rumble - dt * 1.2); const r = A.rumble;
      if (!A.glassMesh) A.glassMesh = root.getObjectByName('glasses');
      if (A.glassMesh) A.glassMesh.position.set(Math.sin(t * 61) * 0.008 * r, Math.abs(Math.sin(t * 47)) * 0.018 * r, Math.sin(t * 53 + 1) * 0.008 * r);
      if (A.pendA) A.pendA.position.x = Math.sin(t * 37) * 0.012 * r;
      if (A.pendB) A.pendB.position.x = Math.sin(t * 41 + 1) * 0.012 * r;
    } else if (A.glassMesh && A.glassMesh.position.y !== 0) { A.glassMesh.position.set(0, 0, 0); if (A.pendA) A.pendA.position.x = 0; if (A.pendB) A.pendB.position.x = 0; }
    if (A.pendA) A.pendA.rotation.z = Math.sin(t * 0.8) * 0.012, A.pendA.rotation.x = Math.sin(t * 0.63 + 1.2) * 0.008;

      flickT -= dt; if (flickT <= 0) { flick = rnd.chance(0.25) ? rnd.range(0.35, 0.7) : 1; flickT = flick < 1 ? rnd.range(0.04, 0.12) : rnd.range(0.8, 3.5); }
      const k = flick * (0.94 + 0.06 * Math.sin(t * 23));
      A.neon.mat.color.setScalar(k); A.neon.glow.material.opacity = 0.5 * k;
    }
    if (A.glowSmall) A.glowSmall.material.opacity = 0.78 + 0.06 * Math.sin(t * 2.6) + 0.03 * Math.sin(t * 9.1);   // 전구줄·촛불 살짝 일렁임
  };
  VENUE.setMood(0, 0);
}

// ===================== 악기 (실측 미터 단위, 셀 셰이딩용 닫힌 형태) =====================
// 공용 규칙
//  - 모든 나팔(벨)은 안팎 이중 벽으로 닫힌 회전체(bellShell) → 어느 쪽에서 봐도 뚫려 보이지 않음.
//    (OutlineEffect는 뒷면을 검게 밀어내 그리므로, 카메라에 뒷면이 보이는 한 겹짜리 면은 검게 뚫려 보인다)
//  - 금속: metalMat, 나무: glossMat, 나머지: toonMat/toonVC. 정적 부품은 재질별로 1개 메시로 병합.
//  - 손 위치·연주 지점은 anchor()로 이름 붙인 빈 Object3D.

// ---------- 이 파일 전용 도우미 ----------
function _mesh(geo, mat, cast = true, recv = false) { const m = new THREE.Mesh(geo, mat); m.castShadow = cast; m.receiveShadow = recv; return m; }
// uv를 보존한 병합 (텍스처 입힐 때). 모든 조각에 uv가 있어야 함
function _mergeUV(list) {
  return mergeGeometries(list.map(g => {
    let q = g.index ? g.toNonIndexed() : g.clone();
    for (const k of Object.keys(q.attributes)) if (k !== 'position' && k !== 'normal' && k !== 'uv') q.deleteAttribute(k);
    return q;
  }), false);
}
// 색만 입혀 병합 (vcol + mergeVC 묶음). parts = [[geo, color, matrix?], ...]
function _vcMerge(parts) { return mergeVC(parts.map(p => vcol(p[0], p[1], p[2]))); }
// z축 방향 원기둥 (zc 중심)
function _cylZ(r, len, x, y, zc, rs = 14, r2) { return new THREE.CylinderGeometry(r, r2 == null ? r : r2, len, rs).rotateX(Math.PI / 2).translate(x, y, zc); }
// x축 방향 원기둥 (xc 중심)
function _cylX(r, len, xc, y, z, rs = 14, r2) { return new THREE.CylinderGeometry(r, r2 == null ? r : r2, len, rs).rotateZ(Math.PI / 2).translate(xc, y, z); }
// y축 방향 원기둥 (yc 중심)
function _cylY(r, len, x, yc, z, rs = 14, r2) { return new THREE.CylinderGeometry(r, r2 == null ? r : r2, len, rs).translate(x, yc, z); }
// 두 점을 잇는 막대 (양 끝에 살짝 두꺼운 플랜지 선택)
function _bar(a, b, r, rs = 10, flange = 0) {
  const A = V3(...a), B = V3(...b), d = B.clone().sub(A), len = d.length();
  const g = new THREE.CylinderGeometry(r, r, len, rs);
  const list = [g];
  if (flange) { list.push(new THREE.CylinderGeometry(r * 1.7, r * 1.7, flange, rs).translate(0, len / 2 - flange / 2, 0)); list.push(new THREE.CylinderGeometry(r * 1.7, r * 1.7, flange, rs).translate(0, -len / 2 + flange / 2, 0)); }
  const geo = mergeGeometries(list.map(q => q.toNonIndexed()), false);
  const q = new THREE.Quaternion().setFromUnitVectors(V3(0, 1, 0), d.clone().normalize());
  geo.applyQuaternion(q); geo.translate((A.x + B.x) / 2, (A.y + B.y) / 2, (A.z + B.z) / 2);
  return geo;
}
// U자 굽이 (반토러스). plane: 'yz' = 수직면(x 고정)에서 ±z 쪽으로 불룩, 'xy' = 수직면(z 고정)에서 ±x 쪽으로 불룩
// 중심 c=[x,y,z], 반지름 R(두 다리 사이 거리/2), 관 반지름 r, dir = 불룩한 방향 부호
function _uBend(plane, c, R, r, dir = -1, rs = 10, ts = 14) {
  const g = new THREE.TorusGeometry(R, r, rs, ts, Math.PI);
  // 기본: XY 평면, 각도 0(+x)에서 시작해 +y 쪽으로 반바퀴 → 다리 양 끝이 (±R, 0)… -90°에서 시작하게 돌려 다리를 y축 상하로
  g.rotateZ(-Math.PI / 2);                     // 이제 호는 -y 에서 +x 를 지나 +y 로 (불룩한 쪽 +x)
  if (plane === 'yz') g.rotateY(dir < 0 ? Math.PI / 2 : -Math.PI / 2);   // +x 를 ∓z 로
  else if (dir < 0) g.rotateY(Math.PI);        // xy 평면에서 -x 쪽으로
  g.translate(c[0], c[1], c[2]);
  return g;
}
// 닫힌 나팔(벨) 회전체: 목 반지름 r0 → 테두리 반지름 r1, 길이 len, 축은 +y (목이 y=0, 테두리가 y=len)
// pow: 벌어지는 정도(클수록 끝에서 급히 벌어짐). wall: 두께. 테두리에 둥근 비드, 안쪽 벽은 목까지 내려가 작은 구멍으로 닫힘
function bellShell(len, r0, r1, pow = 3, wall = 0.0025, seg = 48, n = 26) {
  const pts = [];
  const f = t => r0 + (r1 - r0) * (Math.pow(t, pow) * 0.88 + 0.12 * Math.pow(t, 1.4));
  pts.push([f(0), 0]);
  for (let i = 1; i <= n; i++) { const t = i / n; pts.push([f(t), t * len]); }
  const b = Math.max(wall * 1.6, 0.0025); // 비드 반지름
  for (let i = 1; i <= 6; i++) { const a = -Math.PI / 2 + (i / 6) * Math.PI; pts.push([r1 + b * Math.cos(a) - b * 0.2, len + b * Math.sin(a) + b * 0.1]); }
  for (let i = n; i >= 0; i--) { const t = i / n; pts.push([Math.max(r0 * 0.55, f(t) - wall), t * len]); }
  pts.push([r0 * 0.4, 0.0]); pts.push([f(0), 0]);
  return latheY(pts, seg).rotateX(-Math.PI / 2); // 축 +y → -z : 목이 z=0, 테두리가 z=-len
}
// 마우스피스 (잔 모양, 축 +y: 림이 y=0, 생크가 -y 쪽)… 호출 쪽에서 회전
function mouthpieceGeo(rimR, cupDepth, shankLen, shankR, seg = 24) {
  const pts = [
    [shankR * 0.75, -shankLen], [shankR, -shankLen * 0.85], [shankR * 1.15, -cupDepth * 1.6], [rimR * 0.7, -cupDepth * 0.9], [rimR * 0.97, -cupDepth * 0.3], [rimR, 0],
    [rimR * 0.78, 0.0005], [rimR * 0.55, -cupDepth * 0.35], [rimR * 0.28, -cupDepth * 0.8], [rimR * 0.16, -cupDepth], [rimR * 0.16, -cupDepth * 1.3], [shankR * 0.4, -shankLen], [shankR * 0.75, -shankLen],
  ];
  return latheY(pts, seg);
}
// 관 끝 장식 고리(페룰)
function _ferruleZ(r, len, x, y, zc, rs = 16) { return _cylZ(r, len, x, y, zc, rs); }

// =====================================================================
// a) 트럼펫 — 마우스피스 +z, 벨 -z, 버튼 +y. 원점 = 2번 밸브 몸통 중심
// =====================================================================
function makeTrumpet() {
  const g = new THREE.Group(); g.name = 'trumpet';
  const brass = metalMat(STYLE.pal.brass, 0.2, { outline: 0.0035 });
  const silver = metalMat('#dfe5ec', 0.15, { outline: 0.0035 });
  const pearl = glossMat('#fbf7f0', 0.3, { outline: 0.003 });
  const cork = toonMat('#b8865a', { outline: 0.003 });
  const B = [];                                   // 놋쇠 조각
  const vz = [0.028, 0, -0.028], rc = 0.0118;     // 밸브 1·2·3 z 위치 (1번이 입 쪽)
  // 밸브 몸통 + 위아래 캡
  for (const z of vz) {
    B.push(_cylY(rc, 0.11, 0, -0.003, z, 22));
    B.push(_cylY(0.0138, 0.012, 0, 0.058, z, 22));                 // 위 캡
    B.push(_cylY(0.0138, 0.012, 0, -0.064, z, 22));                // 아래 캡
    B.push(new THREE.SphereGeometry(0.0105, 14, 8).scale(1, 0.45, 1).translate(0, -0.072, z)); // 아래 캡 둥근 끝
  }
  // 벨 관 (왼쪽 위): 뒤쪽 굽이(백 보우)에서 앞으로
  const bx = -0.017, by = 0.040, rb = 0.0088;
  B.push(_cylZ(rb, 0.105, bx, by, 0.085 - 0.0525, 16));            // z 0.085 → -0.02
  B.push(_uBend('yz', [bx, (by + -0.016) / 2, 0.085], (by + 0.016) / 2, rb, +1, 10, 16)); // 뒤 굽이 (+z 쪽으로 불룩)
  B.push(_cylZ(rb, 0.085 - 0.028, bx, -0.016, (0.085 + 0.028) / 2, 16)); // 아래 다리: 1번 밸브 → 뒤
  // 벨: 목 z=-0.02 → 테두리 z=-0.215 (길이 0.195, 테두리 반지름 0.062)
  B.push(bellShell(0.195, rb, 0.062, 3.0, 0.0022, 56, 30).translate(bx, by, -0.02));
  B.push(_ferruleZ(rb * 1.25, 0.012, bx, by, -0.018, 16));
  // 리드파이프 (오른쪽): 입 쪽 리시버에서 앞으로 → 앞 튜닝 슬라이드 U → 아래 다리로 3번 밸브
  const lx = 0.019, ly = 0.012, rl = 0.0078, ty = -0.034;
  B.push(_cylZ(rl, 0.205 + 0.05, lx, ly, (0.205 - 0.05) / 2, 14));  // z 0.205 → -0.05
  B.push(_cylZ(0.0098, 0.04, lx, ly, 0.185, 16));                   // 리시버
  B.push(_cylZ(0.0115, 0.006, lx, ly, 0.206, 16));                  // 리시버 끝 고리
  // 튜닝 슬라이드 (조금 굵음): 두 다리 z -0.05 → -0.105 + U
  B.push(_cylZ(0.0086, 0.06, lx, ly, -0.078, 14)); B.push(_cylZ(0.0086, 0.06, lx, ty, -0.078, 14));
  B.push(_uBend('yz', [lx, (ly + ty) / 2, -0.105], (ly - ty) / 2, 0.0086, -1, 10, 16));
  B.push(_ferruleZ(0.0105, 0.01, lx, ly, -0.05, 16)); B.push(_ferruleZ(0.0105, 0.01, lx, ty, -0.05, 16));
  B.push(_cylZ(rl, 0.05 - 0.028 + 0.006, lx, ty, (-0.05 - 0.028) / 2 + 0.003, 14)); // 아래 다리 → 3번 밸브
  B.push(_bar([lx, ly - 0.004, -0.09], [lx, ty + 0.004, -0.09], 0.0022, 8, 0.002));     // 슬라이드 가로 버팀
  // 밸브 슬라이드들 (두 다리 + U). 1번: 뒤(+z), 2번: 오른쪽(+x), 3번: 앞(-z)
  const sy1 = -0.028, sy2 = -0.052, rs = 0.0062, R = (sy1 - sy2) / 2, yc = (sy1 + sy2) / 2;
  B.push(_cylZ(rs, 0.105 - 0.028, 0, sy1, (0.105 + 0.028) / 2, 12)); B.push(_cylZ(rs, 0.105 - 0.028, 0, sy2, (0.105 + 0.028) / 2, 12));
  B.push(_uBend('yz', [0, yc, 0.105], R, rs, +1, 10, 14));
  B.push(_cylX(rs, 0.04, 0.02, sy1, 0, 12)); B.push(_cylX(rs, 0.04, 0.02, sy2, 0, 12));
  B.push(_uBend('xy', [0.04, yc, 0], R, rs, +1, 10, 14));
  B.push(_cylZ(rs, 0.135 - 0.028, 0, sy1, -(0.135 + 0.028) / 2, 12)); B.push(_cylZ(rs, 0.135 - 0.028, 0, sy2, -(0.135 + 0.028) / 2, 12));
  B.push(_uBend('yz', [0, yc, -0.135], R, rs, -1, 10, 14));
  for (const z of [0.07, -0.07, -0.115]) B.push(_bar([0, sy1 - 0.002, z], [0, sy2 + 0.002, z], 0.002, 8, 0.0015));  // 슬라이드 버팀
  // 3번 슬라이드 고리, 1번 엄지 안장
  B.push(new THREE.TorusGeometry(0.0105, 0.0017, 8, 20).translate(0, sy1 + 0.0105 + 0.004, -0.1));
  { const sad = new THREE.TorusGeometry(0.008, 0.0016, 8, 12, Math.PI); sad.translate(0, sy1 + 0.009, 0.075); B.push(sad); } // 1번 엄지 안장
  // 새끼손가락 고리 (리드파이프 위, 밸브 앞)
  B.push(new THREE.TorusGeometry(0.0095, 0.0016, 8, 14, Math.PI).rotateY(Math.PI / 2).translate(lx, ly + 0.004, -0.045));
  // 버팀대: 벨관 ↔ 리드파이프
  B.push(_bar([bx + 0.005, by - 0.004, -0.075], [lx - 0.004, ly + 0.004, -0.075], 0.0028, 8, 0.0025));
  B.push(_bar([bx + 0.005, by - 0.004, 0.06], [lx - 0.004, ly + 0.004, 0.06], 0.0028, 8, 0.0025));
  B.push(_bar([bx + 0.003, -0.016 + 0.003, 0.1], [lx - 0.003, ly - 0.003, 0.1], 0.0024, 8, 0.002)); // 뒤 굽이 아래다리 ↔ 리드파이프
  // 워터키 (튜닝 슬라이드 U 아래, 3번 슬라이드 U 아래): 레버 + 코르크 컵
  const wk = (x, y, z) => { B.push(rbox(0.006, 0.004, 0.03, 0.0015, 1).translate(x, y, z)); B.push(_cylY(0.0045, 0.004, x, y - 0.002, z + 0.012, 10)); };
  wk(lx, ty - 0.0105, -0.095); wk(0, sy2 - 0.0085, -0.12);
  const body = _mesh(mergeVC(B.map(q => vcol(q, '#ffffff'))), brass); body.name = 'trumpetBrass'; g.add(body);
  // 마우스피스 (은색): 림이 +z 끝 (z=0.268)
  const mp = mouthpieceGeo(0.0135, 0.014, 0.065, 0.0062, 24).rotateX(Math.PI / 2).translate(lx, ly, 0.268);
  g.add(_mesh(mp, silver));
  // 코르크 두 개 (워터키 컵)
  g.add(_mesh(mergeVC([vcol(_cylY(0.0035, 0.003, lx, ty - 0.0105 - 0.0035, -0.083, 8), '#ffffff'), vcol(_cylY(0.0035, 0.003, 0, sy2 - 0.0085 - 0.0035, -0.108, 8), '#ffffff')]), cork));
  // 밸브 버튼 (눌러서 내려가는 부분): 줄기 + 놋쇠 고리 + 진주 단추
  g.userData.valves = [];
  for (const z of vz) {
    const v = new THREE.Object3D(); v.position.set(0, 0.064, z); g.add(v);
    const stem = _mesh(_cylY(0.003, 0.02, 0, 0.01, 0, 10), brass); v.add(stem);
    const ring = _mesh(mergeVC([vcol(_cylY(0.0108, 0.004, 0, 0.0205, 0, 20), '#ffffff'), vcol(new THREE.TorusGeometry(0.0096, 0.0016, 8, 20).rotateX(Math.PI / 2).translate(0, 0.0245, 0), '#ffffff')]), brass); v.add(ring);
    const cap = _mesh(latheY([[0.0001, 0.0225], [0.0082, 0.0225], [0.0095, 0.0245], [0.0088, 0.0285], [0.005, 0.0305], [0.0001, 0.031]], 20), pearl); v.add(cap);
    g.userData.valves.push(v);
  }
  anchor(g, 'gripR', 0.014, 0.078, 0.0);
  anchor(g, 'gripL', -0.03, -0.022, -0.004);
  anchor(g, 'mouth', lx, ly, 0.268);
  anchor(g, 'bell', bx, by, -0.215);
  g.userData.length = 0.483; g.userData.bellR = 0.062;
  return g;
}

// =====================================================================
// b) 테너 트롬본 — 마우스피스 림이 원점(+z = 입술 쪽), 슬라이드는 -z. 벨 섹션은 슬라이드 위·왼쪽(-x)
//    연주자는 -z 를 보고 있으므로 연주자의 왼쪽 = -x
// =====================================================================
function makeTrombone() {
  const g = new THREE.Group(); g.name = 'trombone';
  const brass = metalMat(STYLE.pal.brass, 0.2, { outline: 0.0035 });
  const silver = metalMat('#dfe5ec', 0.15, { outline: 0.0035 });
  const rubber = toonMat('#2a2630', { outline: 0.003 });
  const S = 0.075;                       // 슬라이드 두 관 간격 (위 관 y=0, 아래 관 y=-S)
  const rIn = 0.0068, rOut = 0.0082;     // 안쪽 관·바깥 관 반지름
  const bxx = -0.045, byy = 0.09;        // 벨 관 축 (x, y)
  const nyy = -0.03;                     // 넥파이프(튜닝 슬라이드 아래 다리) y
  const zCrook = 0.25, zRim = -0.45;
  const B = [];
  // --- 고정 슬라이드(안쪽 관) 두 개: z 0.02 → -0.72, 끝에 스타킹(살짝 굵음)
  for (const y of [0, -S]) {
    B.push(_cylZ(rIn, 0.74, 0, y, -0.35, 14));
    B.push(_cylZ(rIn * 1.18, 0.09, 0, y, -0.675, 14));                       // 스타킹
  }
  B.push(_cylZ(0.0105, 0.05, 0, 0, -0.005, 16));                              // 마우스피스 리시버
  B.push(_cylZ(0.0125, 0.006, 0, 0, 0.018, 16));
  B.push(_cylZ(0.0115, 0.028, 0, -S, 0.0, 16));                               // 슬라이드 리시버 (벨 섹션 연결) + 잠금 고리
  B.push(_cylZ(0.0135, 0.008, 0, -S, 0.012, 16));
  B.push(_bar([0, -0.004, -0.085], [0, -S + 0.004, -0.085], 0.0032, 10, 0.003));   // 안쪽 슬라이드 버팀대 (왼손)
  B.push(_bar([0, -0.004, -0.03], [0, -S + 0.004, -0.03], 0.0025, 10, 0.0025));
  // --- 넥파이프: 아래 슬라이드 관 리시버에서 왼쪽 위로 휘어 뒤(+z)로
  B.push(tubeAlong([[0, -S, 0.02], [-0.012, -S + 0.008, 0.06], [-0.034, nyy - 0.012, 0.11], [bxx, nyy, 0.16], [bxx, nyy, zCrook - 0.02]], 0.0082, 30, 12));
  // --- 튜닝 슬라이드 (뒤 굽이, 머리 뒤로 넘어감): 두 다리 + 크룩
  const Rc = (byy - nyy) / 2, yc = (byy + nyy) / 2;
  B.push(_cylZ(0.0092, 0.12, bxx, nyy, zCrook - 0.06, 14)); B.push(_cylZ(0.0092, 0.12, bxx, byy, zCrook - 0.06, 14));
  B.push(_uBend('yz', [bxx, yc, zCrook], Rc, 0.0092, +1, 12, 20));
  B.push(_ferruleZ(0.011, 0.012, bxx, nyy, zCrook - 0.12, 16)); B.push(_ferruleZ(0.011, 0.012, bxx, byy, zCrook - 0.12, 16));
  B.push(_bar([bxx, nyy + 0.005, zCrook - 0.02], [bxx, byy - 0.005, zCrook - 0.02], 0.0028, 8, 0.0025));  // 크룩 버팀
  // 균형추 (튜닝 슬라이드 크룩 위 작은 통)
  B.push(_cylZ(0.016, 0.03, bxx, byy, zCrook - 0.03, 16));
  // --- 벨 관: 뒤 굽이에서 앞으로, 서서히 굵어지다 벨 목으로
  B.push(_cylZ(0.0085, 0.24 + 0.13, bxx, byy, (zCrook - 0.12 - 0.13) / 2, 14, 0.011));       // z 0.13 → -0.13 (테이퍼)
  B.push(_cylZ(0.011, 0.06, bxx, byy, -0.15, 16, 0.014));                                      // z -0.12 → -0.18 목
  B.push(bellShell(0.27, 0.014, 0.11, 2.5, 0.0024, 64, 32).translate(bxx, byy, -0.18));         // 테두리 z=-0.45
  B.push(_ferruleZ(0.0125, 0.012, bxx, byy, -0.118, 16));
  // --- 벨 버팀대 두 개 (벨 관 ↔ 넥파이프), 슬라이드 섹션 ↔ 벨 섹션 연결 버팀
  B.push(_bar([bxx, byy - 0.006, 0.0], [bxx, nyy + 0.006, 0.0], 0.0032, 10, 0.003));

// 무작위 손님 외모 (시드 고정)
function randomLook(seed) {
  const r = seeded(seed * 7919 + 13);
  const fem = r.chance(0.5);
  const hairs = fem ? ['long', 'bob', 'bun', 'pony', 'curly', 'afro', 'short', 'long'] : ['short', 'side', 'buzz', 'pomp', 'curly', 'afro', 'bald', 'short', 'mohawk'];
  const hair = r.pick(hairs);
  const styles = fem ? ['tee', 'dress', 'sweater', 'blazer', 'shirt', 'tank', 'tee', 'hoodie'] : ['tee', 'shirt', 'jacket', 'sweater', 'polo', 'hoodie', 'tee', 'blazer'];
  const topStyle = r.pick(styles);
  const L = {
    seed, fem, hair, hairColor: hair === 'bald' ? r.pick(['#e8d9c0', '#5c3a22', '#2a2b33']) : r.pick(HAIR_COLORS),
    skin: r.pick(SKINS), top: r.pick(TOP_COLORS), topStyle, pants: r.pick(PANTS_COLORS), shoes: r.pick(['#2a1e1a', '#f4ead8', '#8a2f1d', '#22244a', '#ee4a2c']),
    h: r.range(0.93, 1.06) * (fem ? 0.96 : 1), w: r.range(0.92, 1.12), belly: r.chance(0.25) ? r.range(0.4, 1) : 0, headScale: r.range(1.62, 1.82),
    nose: r.range(0.85, 1.35), eye: r.pick(['#2a1a14', '#3a2a1a', '#1e2a3a', '#2a3a1e']),
  };
  if (topStyle === 'jacket' || topStyle === 'blazer') { L.jacket = r.pick(['#22244a', '#6b3a1e', '#2f5a42', '#7a2f1d', '#c99552', '#2f5bd8', '#ee4a2c', '#7b3fb0']); L.shirt = r.pick(['#fff4de', '#ffd84a', '#ff8a5c', '#8cc8ff']); if (!fem && r.chance(0.5)) L.tie = r.pick(['#ee4a2c', '#2f5bd8', '#ffbf2e', '#13a08a']); }
  if (topStyle === 'dress') { L.dress = L.top; L.tights = r.chance(0.3) ? '#22244a' : null; }
  if (r.chance(0.3) && (topStyle === 'tee' || topStyle === 'sweater')) L.stripe = r.pick(['#fff4de', '#22244a', '#ffbf2e', '#ee4a2c']);
  if (r.chance(0.26)) L.glasses = r.pick(['#1e1a1e', '#c79a3b', '#7a2f1d', '#2f5bd8']);
  if (!fem && r.chance(0.28)) { if (r.chance(0.5)) L.beard = true; else if (r.chance(0.5)) L.mustache = true; else L.goatee = true; }
  if (r.chance(0.16) && hair !== 'afro' && hair !== 'bun' && hair !== 'mohawk') { L.hat = r.pick(['beret', 'fedora', 'cap', 'beanie']); L.hatColor = r.pick(['#22244a', '#3a2a1e', '#ee4a2c', '#2f5bd8', '#ffbf2e', '#13a08a']); }
  if (fem && r.chance(0.4)) L.earring = r.pick(['#ffbf2e', '#e8e8f0']);
  if (fem) L.mouthColor = r.pick(['#8a1830', '#a01c36', '#6a1824']);
  return L;
}

// ===================== 1인칭: 내 트럼펫과 두 손 =====================
// 트럼펫 좌표: 마우스피스 +z, 벨 -z, 밸브 단추 +y, 원점은 2번 밸브 케이싱 가운데. +x = 내 오른쪽
const ME = { press: [0, 0, 0], press2: [0, 0, 0], lift: 0, pitchLift: 0, bend: 0, introK: 1, buzz: 0 };

function capsuleBetween(a, b, r, mat) {
  const d = new THREE.Vector3().subVectors(b, a), len = Math.max(1e-4, d.length());
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(r, len, 4, 12), mat);

  m.quaternion.setFromUnitVectors(V3(0, 1, 0), d.normalize());

}
// 납작한 타원체 (손바닥·손톱): 중심, 길이 방향, 너비 방향, 반지름 (길이/너비/두께)

  const m = new THREE.Mesh(new THREE.SphereGeometry(1, seg, Math.round(seg * 0.7)), mat);
  m.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(x, y, z));
  m.scale.set(r[1], r[0], r[2]); m.position.copy(center);
  return m;
}

  const x = kI.clone().sub(kP), wid = x.length() + pad; x.addScaledVector(y, -x.dot(y)).normalize();   // 새끼 → 검지
  const z = new THREE.Vector3().crossVectors(x, y).normalize();

  for (let i = 0; i < p.count; i++) { const t = clamp(p.getY(i) / L + 0.5, 0, 1); p.setX(i, p.getX(i) * lerp(0.74, 1, t)); p.setZ(i, p.getZ(i) * lerp(0.84, 1, t)); }

// 밸브 단추 윗면 (트럼펫 좌표)

}

let VENUE = null;

function initScene() {

  const dpr = window.devicePixelRatio || 1;
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: dpr < 1.5, powerPreference: 'high-performance' });

  renderer.autoClear = false;

  const scene = new THREE.Scene(); scene.background = new THREE.Color('#f6e2c0');
  SC.scene = scene;

  SC.vmScene = new THREE.Scene();
  SC.vmCam = new THREE.PerspectiveCamera(42, 1, 0.01, 5);
  SC.vmScene.add(new THREE.HemisphereLight('#fff4e0', '#c98a52', 1.6));
  const vs = new THREE.DirectionalLight('#ffe2b8', 2.6); vs.position.set(-1.5, 2.5, 1.5); SC.vmScene.add(vs);
  const vf = new THREE.DirectionalLight('#d6e6ff', 0.8); vf.position.set(1.5, 0.6, 2); SC.vmScene.add(vf);
  onResize();
  window.addEventListener('resize', onResize);
}
function onResize() {
  UI.inputRect = null;
  if (UI.fingerPos != null) UI.fingerDirty = true;
  const w = window.innerWidth, h = window.innerHeight;
  SC.W = w; SC.H = h; SC.portrait = h > w;
  SC.renderer.setSize(w, h, false);
  const asp = w / h;
  // 세로 화면: 가로 시야를 넓게 잡아 밴드 양끝이 들어오게
  const hfov = SC.portrait ? 58 : 82;
  let vfov = 2 * Math.atan(Math.tan(hfov * Math.PI / 360) / asp) * 180 / Math.PI;
  vfov = clamp(vfov, 46, SC.portrait ? 80 : 88);
  SC.camera.fov = vfov; SC.baseFov = vfov; SC.camera.aspect = asp; SC.camera.updateProjectionMatrix();
  SC.vmCam.fov = vfov; SC.vmCam.aspect = asp; SC.vmCam.updateProjectionMatrix();
  if (FIN.on) finLayout();
  aimCamera();
  if (ME.rig) placeMe();
}
function aimCamera() {
  const e = LAYOUT.eye, l = LAYOUT.look;
  SC.camera.position.set(e[0], e[1], e[2]);
  // 세로 화면은 오른쪽 줄기가 가리는 만큼 시선을 살짝 오른쪽으로 (무대 가운데가 화면 왼쪽 빈 곳에 오게)
  SC.camera.lookAt(l[0] + (SC.portrait ? 0.85 : 0.3), SC.portrait ? l[1] - 0.85 : l[1], l[2]);
  // 공연이 끝난 뒤: 단 앞으로 다가가 팬들과 내민 물건을 내려다봄
  const k = smooth01(FIN.camK);
  if (k > 0.0005 && FIN.lay) { SC.camera.position.lerp(FIN.lay.eye, k); SC.camera.quaternion.slerp(FIN.lay.q, k); }
}

// ---------- 시작 ----------
function boot() {
  const bootT0 = performance.now();
  initScene();
  perfRestore();
  VENUE = buildVenue(SC.scene);
  setupBand(SC.scene);
  setupCrowd(SC.scene);
  setupMe();
  bigInit();
  initUI();
  warmSetup();
  SC.renderer.shadowMap.needsUpdate = true;
  if (AE.at) { AE.at.boot0 = bootT0; AE.at.boot1 = performance.now(); }
  window.__booted = true;
  if (/norender/.test(location.search)) setInterval(() => tick(false), 33);   // 시험용: 그리지 않고 진행만
  else if (!/shot/.test(location.search)) requestAnimationFrame(loop);
}
function frame(dt) {
  const t = NOW.t;
  const audible = AE.ctx ? AE.ctx.currentTime - (AE.ctx.outputLatency || 0) : 0;
  if (MUS.running && AE.ctx) { processVQ(audible); trumpetTick(); }
  const beat = MUS.running && AE.ctx ? beatAt(audible) : t * 2;
  if (AE.ctx) { const nowA = AE.ctx.currentTime; spUpdate(dt); ruleTick(nowA); endlessTick(nowA); missTick(dt, nowA); }
  preTick(); itlTick();
  reactUpdate(dt, t);
  finTick(dt, t);
  directorUpdate(dt, t, audible, beat);
  crowdUpdate(dt, t, beat);
  hypeUpdate(dt, t, beat);
  updateWindowFaces(dt, t, beat);
  fxUpdate(dt);
  updateMe(dt, t);
  if (VENUE && VENUE.setMood) VENUE.setMood(REACT.frenzy, t);
  if (VENUE && VENUE.update) VENUE.update(dt, t, beat);
  uiTick();
  vjobTick();
}
function render() {
  const R = SC.renderer;
  if (WARM.draw) warmDraw();
  R.clear();
  NOW.frame++; if (NOW.frame % PERF.shadowEvery === 1 || PERF.shadowEvery === 1) R.shadowMap.needsUpdate = true;
  PEOPLE.drawing = true;
  try {
    SC.effect.render(SC.scene, SC.camera);
    R.clearDepth();
    SC.effect.render(SC.vmScene, SC.vmCam);
  } finally { PEOPLE.drawing = false; }
}
// ---------- 미리 만들어 두기 ----------
// 공연 도중 처음 만들거나 처음 그리면 그 순간 화면이 멈칫하는 것들을 첫 화면에서 조금씩 만들어 둠:
// 뒤늦게 오는 구경꾼, 소품 모양, 던지는 꽃, 점수판 글자, 사인받을 물건. 다 만들면 숨겨 둔 것까지 한 번 그려서 셰이더·버퍼·텍스처를 미리 올림.
// (첫 화면에서 다 못 끝냈으면 공연 전 정적 동안 이어서 함. 그래도 안 된 것은 전처럼 필요할 때 만듦)
const WARM = { q: [], draw: false, done: false };
function warmAdd(fn) { WARM.q.push(fn); }
function warmTick(budget) {
  const t0 = performance.now();
  do { const fn = WARM.q.shift(); try { fn(); } catch (e) { console.error('warm', e); } } while (WARM.q.length && performance.now() - t0 < budget);
}
function warmSetup() {
  for (const k of ['phone', 'cup', 'popper', 'card', 'soul', 'pad', 'cloth']) warmAdd(() => crowdPropTemplate(k));
  warmAdd(() => tossWarm(10));
  warmAdd(() => { const go = () => { for (const t of ['10', '11', '100']) SC.renderer.initTexture(cardTex(t)); }; if (document.fonts && document.fonts.status !== 'loaded' && document.fonts.ready) document.fonts.ready.then(go); else go(); });
  for (let i = 0; i < WINP.slots.length; i++) warmAdd(() => windowPerson(i));
  for (let i = 0; i < BACKP.spots.length; i++) warmAdd(() => backPerson(i));
  for (let i = 0; i < 7; i++) warmAdd(finBuildStep);
  for (const m of CROWD.list) warmAdd(() => faceTintPrep(m.p));
  warmAdd(() => { WARM.draw = true; });
}
// 숨겨 둔 것·화면 밖에 있는 것까지 전부 한 번 그림 (바로 뒤에 정상 화면을 다시 그리므로 눈에는 안 보임)
function warmDraw() {
  WARM.draw = false; WARM.done = true;
  const R = SC.renderer, hidden = [], culled = [];
  for (const sc of [SC.scene, SC.vmScene]) sc.traverse(o => {
    if (o.isLight) return;
    if (!o.visible) { hidden.push(o); o.visible = true; }
    if (o.frustumCulled && (o.isMesh || o.isPoints || o.isSprite || o.isLine)) { culled.push(o); o.frustumCulled = false; }
  });
  for (const p of PEOPLE.all) { p.dirty = true; p.skDirty = true; }
  try {
    R.shadowMap.needsUpdate = true; R.clear();
    SC.effect.render(SC.scene, SC.camera); R.clearDepth(); SC.effect.render(SC.vmScene, SC.vmCam);
  } catch (e) { console.error('warm draw', e); }
  for (const o of hidden) o.visible = false;
  for (const o of culled) o.frustumCulled = true;
  R.shadowMap.needsUpdate = true;
}
// 느린 기기: 몇 초 재 보고 해상도·그림자 갱신을 단계적으로 낮춤 (올리지는 않음)
const PERF = { acc: 0, n: 0, level: 0, shadowEvery: 2 };
function perfTick(rawDt) {
  if (GAME.state !== 'play' || document.hidden || rawDt <= 0 || rawDt > 0.5) { PERF.acc = 0; PERF.n = 0; return; }
  PERF.acc += rawDt; PERF.n++;
  if (PERF.acc < 3) return;
  const avg = PERF.acc / PERF.n; PERF.acc = 0; PERF.n = 0;
  if (avg > 0.026 && PERF.level < 3) {
    PERF.level = Math.min(3, PERF.level + (avg > 0.045 ? 2 : 1));
    perfApply();
    try { sessionStorage.setItem('egotrip.perf', String(PERF.level)); } catch (e) { }
  }
}
function perfApply() {
  const dpr = window.devicePixelRatio || 1;
  SC.renderer.setPixelRatio(Math.min(dpr, [1.75, 1.4, 1.15, 1][PERF.level]));
  SC.renderer.setSize(SC.W, SC.H, false);
  PERF.shadowEvery = [2, 3, 5, 8][PERF.level];
}
// 이 탭에서 앞서 낮춰 둔 단계가 있으면 그 단계에서 시작
function perfRestore() {
  try { const lv = Math.round(+sessionStorage.getItem('egotrip.perf')); if (lv >= 1 && lv <= 3) { PERF.level = lv; perfApply(); } } catch (e) { }
}
function tick(draw) {
  const n = performance.now();
  let dt = (n - (NOW.last || n)) / 1000; NOW.last = n;
  if (draw) perfTick(dt);
  dt = clamp(dt, 0, 0.1);
  if (GAME.state === 'paused') dt = 0;
  NOW.dt = dt; NOW.t += dt;
  // 첫 화면에서는 한 프레임에 16ms씩(이미 시작을 눌러 기다리는 중이면 40ms씩) 미리 만들기에 씀. 공연 중으로 넘어온 뒤라면 3ms씩만
  if (WARM.q.length) { warmTick(GAME.phase === 'title' ? (UI.wantStart ? 40 : 16) : 3); if (!WARM.q.length && UI.wantStart && AE.decoded && !UI.playing) startGame(); }
  const pf = window.__prof, p0 = pf ? performance.now() : 0;
  try { frame(dt); } catch (err) { if (!tick.errs) tick.errs = 0; if (tick.errs++ < 5) console.error(err); }
  const p1 = pf ? performance.now() : 0;
  if (draw) render();
  if (pf) pf(p1 - p0, draw ? performance.now() - p1 : 0, dt);
}
function loop() { requestAnimationFrame(loop); tick(true); }
// 시험용: 원하는 시간만큼 진행한 장면을 그림
window.__step = (sec = 1, fps = 30) => { for (let i = 0; i < sec * fps; i++) { NOW.t += 1 / fps; frame(1 / fps); } render(); window.__ready = true; return 'ok'; };
window.__G = { SC, BAND, CROWD, ME, MUS, TP, AE, NOW, GAME, REACT, DIR, VQ, LAYOUT, UI, startGame, pauseGame, resumeGame, ribbonDown, ribbonMove, ribbonUp, setMode, render, stare, bandAwe, aimCamera };
window.__G2 = { updateMe, placeMe, doublePose, bartenderDrop, SPX, PRE, ITL, AFTER, ENDL, MISS, RULE, WINP, BACKP, FXP, spPress, spToggle, specialSetPiece, forceScene, itlStart, itlEnd, afterShow, afterEnd, endSong, nextSong, crowdJerk, gesture, reactEvent, addWindowFaces, addBackCrowd, HYPE, TOSS, crowdShock, throwGifts, poppers, scoreCards, toastWave, bartenderBell, tbWorship, bandFlourish, startChant, fxConfettiDrop, startCrowdScene, finishCrowdScene, myApplause, ovation, FIN, FIN_SLOTS, finRequest, finBegin, finEncore, finSigned, finLayout, finEnd, PERF, PEOPLE, Person, randomLook, makeCrowdProp, THREE, BASS_POSE, BASS_GUARD, DRPHONE, WARM, WINP, BACKP, PROP_TPL, crowdPropTemplate, tossWarm, CROWD_RATE, VJOB, SYNTH_STEPS, synthBegin, PACK, RBOX, perfTick, perfRestore };
// 무대 만들기(본 화면이 1초~몇 초 멈춤)에 들어가기 전에 소리 쪽 일을 먼저 출발시킴.
// 워커는 본 화면이 쉬어야 뜨므로, 워커가 떴다는 신호를 받고 나서(안 오면 0.4초 뒤) 무대를 만듦.
function bootSoon() {
  let ran = false;
  const go = () => { if (ran) return; ran = true; boot(); if (AE.synWatch) AE.synWatch(); if (/shot/.test(location.search)) { window.__step(1.5); } };
  try { synthBegin(() => setTimeout(go, 0)); if (window.JAZZ_AUDIO) packBegin(); } catch (e) { console.error(e); }
  setTimeout(go, 400);
}
bootSoon();
